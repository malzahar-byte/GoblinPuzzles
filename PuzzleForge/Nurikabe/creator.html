<!DOCTYPE html>
<html lang="en" data-bs-theme="dark"><head>
<script>try{var s=JSON.parse(localStorage.getItem('gdp-nurikabe-settings')||'{}');document.documentElement.setAttribute('data-bs-theme',s.theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'))}catch(e){}</script>
<title>Create a Nurikabe</title>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link rel="stylesheet" href="../../shared/gdp-theme.css?v=13.0.7logic">
</head><body>
<button type="button" id="freshBtn" class="gdp-fresh-btn" title="Load the latest version of this page">↻ Fresh <span class="gdp-build-tag" id="buildTag"></span></button>
<div class="gdp-page">
  <div class="gdp-header"><h1>Create a Nurikabe</h1><div class="gdp-subtitle">Generate a puzzle, hide a message, share the link.</div></div>
  <div class="gdp-panel p-3 d-flex flex-column gap-3">
    <label class="form-label mb-0">Width (5–12)<input id="w" type="number" class="form-control" value="8" min="5" max="12"></label>
    <label class="form-label mb-0">Height (5–12)<input id="h" type="number" class="form-control" value="8" min="5" max="12"></label>
    <label class="form-label mb-0">Secret message<input id="secret" type="text" class="form-control" placeholder="Well done!"></label>
    <div id="err" class="text-danger" style="display:none"></div>
    <button id="createBtn" class="btn btn-primary" type="button">Generate &amp; create link</button>
    <div id="out" style="display:none">
      <label class="form-label mb-1">Your link</label>
      <input id="link" class="form-control mb-2" readonly>
      <div class="d-flex gap-2">
        <button id="copyBtn" class="btn btn-outline-secondary btn-sm" type="button">Copy</button>
        <a id="playLink" class="btn btn-outline-primary btn-sm" target="_blank">Open puzzle</a>
      </div>
    </div>
  </div>
</div>
<script type="module">
import { CHAR_TO_NUM } from '../../shared/gdp-math-utils.js?v=13.0.7logic';
import { generate, encodeLink } from './js/nurikabe-logic.js?v=13.0.7logic';
import { setupFreshButton } from '../../shared/gdp-fresh.js?v=13.0.7logic';
import { applyTheme } from './js/util/settings.js?v=13.0.7logic';
applyTheme();
setupFreshButton(document.getElementById('freshBtn'));
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, parseInt(v, 10) || a));
$('createBtn').addEventListener('click', () => {
  $('err').style.display = 'none'; $('out').style.display = 'none';
  const W = clamp($('w').value, 5, 12), H = clamp($('h').value, 5, 12);
  const secret = $('secret').value || 'Well done!';
  const bad = Array.from(secret).filter(ch => !CHAR_TO_NUM.has(ch));
  if (bad.length) { $('err').textContent = "Unsupported characters: " + Array.from(new Set(bad)).join(' '); $('err').style.display = 'block'; return; }
  const p = generate(W, H, Math.random, { tries: 400 });
  if (!p) { $('err').textContent = 'Could not generate a unique puzzle at this size — try again or a different size.'; $('err').style.display = 'block'; return; }
  const id = encodeLink(p.W, p.H, p.clues, secret, 0);
  const here = location.href.split(/[?#]/)[0].replace(/[^/]*$/, '');
  const url = here + 'index.html?id=' + id;
  $('link').value = url; $('playLink').href = url; $('out').style.display = 'block';
});
$('copyBtn').addEventListener('click', () => { $('link').select(); document.execCommand('copy'); });
</script></body></html>
