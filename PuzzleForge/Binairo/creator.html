<!DOCTYPE html><html lang="en" data-bs-theme="dark"><head><script>try{var s=JSON.parse(localStorage.getItem('gdp-binairo-settings')||'{}');document.documentElement.setAttribute('data-bs-theme',s.theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'))}catch(e){}</script><title>Create a Binairo</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../../shared/gdp-theme.css?v=13.0.11logic"></head><body><button type="button" id="freshBtn" class="gdp-fresh-btn" title="Load the latest version of this page">↻ Fresh <span class="gdp-build-tag" id="buildTag"></span></button><div class="gdp-page"><div class="gdp-header position-relative"><h1>Create a Binairo</h1><div class="gdp-subtitle">Generate a puzzle, hide a message, share the link.</div><button type="button" id="themeBtn" class="btn btn-outline-secondary btn-sm" style="position:absolute;top:0;right:0"></button></div><div class="gdp-panel p-3 mb-3"><div class="row g-3"><div class="col-6"><label class="form-label mb-0" for="n">Size (even, 6–12)</label><input id="n" type="number" class="form-control" min="6" max="12" value="8"></div><div class="col-12"><label class="form-label mb-0" for="secret">Secret message</label><input id="secret" type="text" class="form-control" value="Well done!"></div></div></div><div class="text-center mb-3"><button type="button" id="createBtn" class="btn btn-primary btn-lg">Generate & create link</button></div><div id="err" class="p-2 mb-3 bg-danger bg-opacity-10 border border-danger rounded" style="display:none"></div><div id="out" class="gdp-panel p-3" style="display:none"><div class="fw-bold mb-1">Your link</div><input id="link" class="form-control" readonly><div class="mt-2"><button type="button" id="copyBtn" class="btn btn-sm btn-secondary">Copy</button> <a id="playLink" class="btn btn-sm btn-primary" target="_blank">Open puzzle</a></div></div></div><script type="module">import { CHAR_TO_NUM } from '../../shared/gdp-math-utils.js?v=13.0.11logic';import { encodeFromMessage } from './js/binairo-logic.js?v=13.0.11logic';import { setupFreshButton } from '../../shared/gdp-fresh.js?v=13.0.11logic';import { applyTheme, setupThemeButton } from './js/util/settings.js?v=13.0.11logic';applyTheme();setupThemeButton(document.getElementById('themeBtn'));setupFreshButton(document.getElementById('freshBtn'));const $=id=>document.getElementById(id);const clamp=(v,a,b)=>Math.max(a,Math.min(b,parseInt(v,10)||a));$('createBtn').addEventListener('click',()=>{$('err').style.display='none';$('out').style.display='none';let N=clamp($('n').value,6,12);if(N%2)N=N+1<=12?N+1:N-1; const secret=$('secret').value||'Well done!';const bad=Array.from(secret).filter(ch=>!CHAR_TO_NUM.has(ch));if(bad.length){$('err').textContent='Unsupported characters: '+Array.from(new Set(bad)).join(' ');$('err').style.display='block';return}let id;try{id=encodeFromMessage(N,secret,0)}catch(e){$('err').textContent='Could not seed a unique puzzle for this message at this size — try a different size.';$('err').style.display='block';return}const here=location.href.split(/[?#]/)[0].replace(/[^/]*$/,'');const url=here+'index.html?id='+id;$('link').value=url;$('playLink').href=url;$('out').style.display='block'});$('copyBtn').addEventListener('click',()=>{navigator.clipboard?.writeText($('link').value).then(()=>$('copyBtn').textContent='Copied!')});</script></body></html>
