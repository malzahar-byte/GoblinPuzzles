<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<script>try{var s=JSON.parse(localStorage.getItem('gdp-forge-settings')||'{}');document.documentElement.setAttribute('data-bs-theme',s.theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'))}catch(e){}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goblin's Puzzle Forge</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link rel="stylesheet" href="../shared/gdp-theme.css?v=13.0.0logic">
<style>
.forge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 0.9rem; }
.forge-box { display: block; padding: 1rem; color: inherit; text-decoration: none; height: 100%; }
.forge-box h2 { font-size: 1.15rem; font-weight: 700; margin: 0 0 0.3rem; }
.forge-box p { margin: 0 0 0.6rem; font-size: 0.9rem; color: var(--gdp-muted); }
.forge-tag { font-size: 0.8rem; font-weight: 600; }
a.forge-box:hover, a.forge-box:focus-visible { border-color: var(--gdp-accent); outline: none; }
.forge-off h2, .forge-off p { text-decoration: line-through; }
.forge-off { opacity: 0.55; }
.forge-wip .forge-tag { color: var(--gdp-accent); }
</style>
</head>
<body>
<button type="button" id="freshBtn" class="gdp-fresh-btn" title="Load the latest version of this page">↻ Fresh <span class="gdp-build-tag" id="buildTag"></span></button>
<div class="gdp-page gdp-page-wide">
    <div class="gdp-header position-relative">
        <h1>Goblin's Puzzle Forge</h1>
        <div class="gdp-subtitle">Pick a puzzle, build your own, hide a secret message inside it.</div>
        <button type="button" id="themeBtn" class="btn btn-outline-secondary btn-sm" style="position:absolute; top:0; right:0;"></button>
    </div>
    <div class="forge-grid" id="grid"></div>
    <p class="gdp-muted small text-center mt-4">Crossed-out puzzles aren't ready yet.</p>
    <div class="gdp-section-title mt-4">Test mode</div>
    <p class="gdp-muted small mb-2">One ready-to-open example of each working puzzle — no creating required. Just to look at how each one plays.</p>
    <div class="forge-grid" id="testGrid"></div>
</div>
<script type="module">
import { applyTheme, setupThemeButton } from './js/util/settings.js?v=13.0.0logic';
import { setupFreshButton } from '../shared/gdp-fresh.js?v=13.0.0logic';
setupFreshButton(document.getElementById('freshBtn'));
applyTheme();
setupThemeButton(document.getElementById('themeBtn'));

// status: 'live' (link works), 'wip' (being built; may link to its creator to test), 'off' (not started)
const PUZZLES = [
    { name: 'Pictogram', status: 'live', href: './Pictogram/creator.html', text: 'Turn a picture into a nonogram.' },
    { name: 'Nonogram', status: 'live', href: './Nonogram/creator.html', text: 'Build a random grid puzzle with a secret message.' },
    { name: 'Hashi (first draft)', status: 'live', href: './Hashi/creator.html', text: 'Join islands with bridges so every island has the right number.' },
    { name: 'Akari', status: 'live', href: './Akari/creator.html', text: 'Place lamps to light every cell, guided by the numbered walls.' },
    { name: 'Nurikabe', status: 'off', text: 'Shade the walls so every island has the right size.' },
    { name: 'Skyscrapers', status: 'wip', href: './Skyscrapers/creator.html', text: 'Fill the grid with towers; edge clues say how many you can see.' },
    { name: 'Binairo', status: 'wip', href: './Binairo/creator.html', text: 'Fill a grid with 0s and 1s using simple balance rules.' },
    { name: 'Futoshiki / KenKen', status: 'wip', href: './Futoshiki/creator.html', text: 'Latin squares with inequality or arithmetic clues.' },
    { name: 'Slitherlink', status: 'off', text: 'Draw one loop that matches every number.' },
    { name: 'Crossword generator', status: 'off', text: 'Supply the words and clues; the Forge builds and locks the grid.' },
    { name: 'Train Tracks', status: 'off', text: 'Lay track using the row and column counts.' },
    { name: 'Chained mode', status: 'off', text: 'Link several puzzles into one sequence.' }
];
const LABEL = { live: 'Play', wip: 'In progress', off: 'Not active yet' };
const grid = document.getElementById('grid');
for (const p of PUZZLES) {
    const box = document.createElement(p.href ? 'a' : 'div');
    box.className = 'gdp-panel forge-box' + (p.status === 'off' ? ' forge-off' : p.status === 'wip' ? ' forge-wip' : '');
    if (p.href) box.href = p.href;
    else box.setAttribute('aria-disabled', 'true');
    const h = document.createElement('h2'); h.textContent = p.name;
    const t = document.createElement('p'); t.textContent = p.text;
    const s = document.createElement('span'); s.className = 'forge-tag'; s.textContent = LABEL[p.status];
    box.append(h, t, s);
    grid.appendChild(box);
}
const TEST_LINKS = [
  { name: 'Pictogram', href: './Pictogram/index.html?id=cCM-Fl-sEWICog_V' },
  { name: 'Nonogram', href: './Nonogram/index.html?id=EkjCQkVo_E1zztIsWQNdH2j2pF' },
  { name: 'Hashi', href: './Hashi/play.html?id=-Xrybal-KMq-okrX60hypwGl' },
  { name: 'Akari', href: './Akari/index.html?id=ooAqM4-kPW8e--eiYWs-1Iwg-_dEkY2WW--&_gdp=muu0wg83' },
  { name: 'Skyscrapers', href: './Skyscrapers/index.html?id=_GkduhIEGcUqE-d-sFF-j-Ehwh--aeaUka-fyxo' },
  { name: 'Binairo', href: './Binairo/index.html?id=IeqUb-UsJEgNoQQGcb_XI-Eskk-c' },
  { name: 'Futoshiki', href: './Futoshiki/index.html?id=--d_-O_ig-Vco-qoo-o-M-i-gggdk-F-dE-ci_-sa-_gaa_' }
];
const testGrid = document.getElementById('testGrid');
for (const t of TEST_LINKS) {
  const ready = !/PASTE_/.test(t.href);
  const box = document.createElement(ready ? 'a' : 'div');
  box.className = 'gdp-panel forge-box' + (ready ? '' : ' forge-off');
  if (ready) box.href = t.href; else box.setAttribute('aria-disabled', 'true');
  const h = document.createElement('h2'); h.textContent = t.name;
  const p = document.createElement('p'); p.textContent = ready ? 'Open a ready-made example.' : 'Example link not added yet.';
  const tag = document.createElement('span'); tag.className = 'forge-tag'; tag.textContent = ready ? 'Play' : 'Not set';
  box.append(h, p, tag); testGrid.appendChild(box);
}
</script>
</body>
</html>
