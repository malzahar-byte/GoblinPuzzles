<!DOCTYPE html>
<html lang="en" data-bs-theme="dark"><head><script>try{var s=JSON.parse(localStorage.getItem('gdp-hashi-settings')||'{}');document.documentElement.setAttribute('data-bs-theme',s.theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'))}catch(e){}</script><title>Hashi Creator</title>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link rel="stylesheet" href="../../shared/gdp-theme.css?v=13.0.17logic">
<script type="module">import { setupFreshButton } from '../../shared/gdp-fresh.js?v=13.0.17logic'; setupFreshButton(document.getElementById('freshBtn'));</script>
</head><body>
<button type="button" id="freshBtn" class="gdp-fresh-btn" title="Load the latest version of this page">↻ Fresh <span class="gdp-build-tag" id="buildTag"></span></button>
<div class="gdp-page">
  <div class="gdp-header position-relative"><h1>Hashi</h1><div class="gdp-subtitle">Creator (first draft) — random puzzle with a secret message</div>
    <button type="button" id="themeBtn" class="btn btn-outline-secondary btn-sm" style="position:absolute;top:0;right:0"></button></div>
  <div class="gdp-panel p-3 mb-3"><div class="row g-3">
    <div class="col-6"><label class="form-label mb-0" for="cols">Columns (5-14)</label><input id="cols" type="number" class="form-control" min="5" max="14" value="8"></div>
    <div class="col-6"><label class="form-label mb-0" for="rows">Rows (5-14)</label><input id="rows" type="number" class="form-control" min="5" max="14" value="8"></div>
    <div class="col-12"><label class="form-label mb-0" for="secret">Secret message</label><input id="secret" type="text" class="form-control" value="Well done!">
      <div class="form-text">Shown when the puzzle is solved. Plain text only in this draft (no clickable links).</div></div>
  </div></div>
  <div class="text-center mb-3"><button type="button" id="createBtn" class="btn btn-primary btn-lg">Create!</button></div>
  <div id="err" class="p-2 mb-3 bg-danger bg-opacity-10 border border-danger rounded" style="display:none"></div>
  <div id="out" class="gdp-panel p-3" style="display:none"><div class="fw-bold mb-1">Your puzzle is ready</div>
    <a id="link" target="_blank" style="word-break:break-all"></a><div class="mt-2"><button type="button" id="copyBtn" class="btn btn-sm btn-secondary">Copy link</button></div></div>
</div>
<script type="module">
import { applyTheme, setupThemeButton } from './js/util/settings.js';
import { encodeFromMessage } from './js/hashi-logic.js';
import { CHAR_TO_NUM } from '../../shared/gdp-math-utils.js';
applyTheme(); setupThemeButton(document.getElementById('themeBtn'));
const $ = id => document.getElementById(id), clamp = (v, a, b) => Math.max(a, Math.min(b, v || a));
$('createBtn').addEventListener('click', () => {
  $('err').style.display = 'none';
  const secret = $('secret').value, bad = Array.from(secret).filter(ch => !CHAR_TO_NUM.has(ch));
  const fail = m => { $('err').textContent = m; $('err').style.display = 'block'; };
  if (!secret) return fail('Please enter a secret message.');
  if (bad.length) return fail("These characters aren't supported: " + [...new Set(bad)].join(' '));
  const W = clamp(parseInt($('cols').value, 10), 5, 14), H = clamp(parseInt($('rows').value, 10), 5, 14);
  let id;
  try { id = encodeFromMessage(W, H, secret); }
  catch (e) { return fail("Couldn't seed a unique puzzle for this message at this size — try a different size."); }
  const here = location.href.split(/[?#]/)[0], link = here.replace(/[^/]*$/, 'play.html') + '?id=' + id;
  $('link').href = link; $('link').textContent = link; $('out').style.display = 'block'; $('copyBtn').textContent = 'Copy link';
});
$('copyBtn').addEventListener('click', () => navigator.clipboard?.writeText($('link').textContent).then(() => $('copyBtn').textContent = 'Copied!'));
</script></body></html>
